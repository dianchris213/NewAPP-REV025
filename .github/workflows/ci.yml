name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (includes jsx-a11y accessibility rules)
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit + UI tests (Vitest)
        run: bun run test --reporter=default --reporter=json --outputFile=test-report/vitest-report.json

      - name: Upload visual regression snapshots + diff report
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-${{ github.event.pull_request.number }}
          path: |
            src/tests/__snapshots__/**
            test-report/**
          if-no-files-found: warn
          retention-days: 14

      - name: Production build
        run: bun run build

      - name: Smoke test the production build
        run: bun run smoke
